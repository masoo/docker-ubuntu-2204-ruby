name: Build and Push Ruby Docker Image for Ubuntu 22.04

on:
  workflow_dispatch:
  schedule:
    # UTC 15:10 on Thursday
    # JST 0:10 on Friday
    - cron: "10 15 * * 4"

permissions:
  contents: read

env:
  LATEST_RUBY_VERSION: "4.0.7"

jobs:
  build-latest:
    name: Build Ruby "4.0.7" (latest)
    runs-on: ubuntu-latest
    outputs:
      cache-bust: ${{ steps.cache-bust.outputs.value }}
    steps:
      - name: Calculate cache-bust value
        id: cache-bust
        run: echo "value=$(date +%Y-%W)" >> $GITHUB_OUTPUT
      - name: Checkout code
        uses: actions/checkout@v6
      - uses: ./.github/actions/docker_hub_push
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          ruby-version: ${{ env.LATEST_RUBY_VERSION }}
          enable-cache-to: "true"
          cache-bust: ${{ steps.cache-bust.outputs.value }}

  build-others:
    name: Build Ruby ${{ matrix.ruby-version }}
    needs: build-latest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        exclude:
          # Exclude the latest version since it's already built
          - ruby-version: "4.0.7"
        ruby-version: [
          3.0.0, 3.0.1, 3.0.2, 3.0.3, 3.0.4, 3.0.5, 3.0.6, 3.0.7,
          3.1.0, 3.1.1, 3.1.2, 3.1.3, 3.1.4, 3.1.5, 3.1.6, 3.1.7,
          3.2.0, 3.2.1, 3.2.2, 3.2.3, 3.2.4, 3.2.5, 3.2.6, 3.2.7, 3.2.8, 3.2.9, 3.2.10, 3.2.11,
          3.3.0, 3.3.1, 3.3.2, 3.3.3, 3.3.4, 3.3.5, 3.3.6, 3.3.7, 3.3.8, 3.3.9, 3.3.10, 3.3.11, 3.3.12,
          3.4.0, 3.4.1, 3.4.2, 3.4.3, 3.4.4, 3.4.5, 3.4.6, 3.4.7, 3.4.8, 3.4.9, 3.4.10, 3.4.11,
          4.0.0, 4.0.1, 4.0.2, 4.0.3, 4.0.4, 4.0.5, 4.0.6, 4.0.7,
        ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - uses: ./.github/actions/docker_hub_push
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          ruby-version: ${{ matrix.ruby-version }}
          enable-cache-to: "false"
          cache-bust: ${{ needs.build-latest.outputs.cache-bust }}

  tag:
    name: Tag images in version order
    needs: [build-latest, build-others]
    # Run even if some builds failed, so that the successful ones still get tagged.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      # A HEAD request does not count towards the pull rate limit.
      - name: Show Docker Hub pull rate limit
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: |
          token="$(curl -fsS -u "${DOCKER_USERNAME}:${DOCKER_PASSWORD}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:ratelimitpreview/test:pull" | jq -r .token)"
          curl -fsS --head -H "Authorization: Bearer ${token}" \
            https://registry-1.docker.io/v2/ratelimitpreview/test/manifests/latest | grep -i '^ratelimit' || true
      # Docker Hub lists tags by last push time, newest first. Tagging from the
      # oldest version to the newest puts the latest Ruby at the top of the list.
      # "crane tag" fetches only the top-level manifest (one pull per version),
      # while "buildx imagetools create" also fetches every child manifest.
      - name: Create tags (oldest version first)
        run: |
          mkdir -p digests
          for version in $(find digests -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort -V); do
            digest="$(cat "digests/${version}")"
            echo "masoo/ubuntu-2204-ruby:${version} -> ${digest}"
            for i in 1 2 3; do
              crane tag "masoo/ubuntu-2204-ruby@${digest}" "${version}" && break
              if [ "${i}" = 3 ]; then
                exit 1
              fi
              echo "retry in $((i * 30))s..."
              sleep $((i * 30))
            done
          done
